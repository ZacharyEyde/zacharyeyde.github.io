# Talks, presentations, and poster sessions. Shown on the /talks/ page.
#
# Posters (type: poster) get their own "poster sessions" section; everything
# else appears under "talks & presentations". Newest first, sorted by date.
#
# Fields (only title is required):
#   title:       talk or poster title
#   type:        talk | invited | seminar | poster
#   abbr:        short badge text, e.g. WSC (defaults to the type)
#   event:       conference, workshop, or venue
#   location:    city, state or country
#   date:        'YYYY-MM' or 'YYYY-MM-DD'. Keep the quotes.
#   paper:       citation key from src/data/papers.bib. Adds a "paper" button.
#   slides:      PDF file name in public/assets/pdf/, or a full URL
#   poster:      PDF file name in public/assets/pdf/, or a full URL
#   video:       full URL to a recording
#   description: one or two sentences (optional)

