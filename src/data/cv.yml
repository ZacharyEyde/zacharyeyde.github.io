    experience:
      - company: Intel Corporation
        position: Senior Technical Staff
        location: Chandler, AZ
        start_date: '2025-06'
        end_date: present
        highlights:
          - Established and lead a cross-organization back-end test quality review, applying statistical root-cause analysis that substantially reduced major quality events and improved thermal-interface performance.
          - Own the vision and roadmap for an automated robotics and machine-vision inspection system for test collateral, and lead its extension to additional test modules and commercial testers.
          - Drive adoption of agentic-AI tools for log debugging, design-rule checking, and vision-model retraining, and of a physics-informed neural network for thermal quality prediction; presented at SEMICON West 2025 and SEMICON West 2026.
          - Serve as Intel mentor and Co-PI for the Intel-ASU Generative Digital Twins for Semiconductor Test Operations research collaboration, including submission of an NSF Translation-to-Practice Partnership proposal.
          - Lead the group's intern program as Intern Champion, coordinating summer intern hiring and intern-to-full-time conversion.

      - company: Intel Corporation
        position: Senior Technical Program Manager
        location: Chandler, AZ
        start_date: '2020-06'
        end_date: '2024-06'
        highlights:
          - Led development and production deployment of new module processes for test collateral repairs, overseeing a 10-person engineering team and reducing total cost of ownership.
          - Upgraded High-Density Burn-In capacity models, improving utilization for high-mix/low-volume operations and closing critical run-rate model gaps, and regularly reporting results to executive leadership.

      - company: Intel Corporation
        position: Module Development Engineer
        location: Chandler, AZ
        start_date: '2014-06'
        end_date: '2020-06'
        highlights:
          - Led a cross-functional task force that resolved CPU yield degradation in high-volume manufacturing.
          - Directed root cause analysis for failed tests and non-conforming products, enhancing quality and reliability of semiconductor products.

      - company: Raytheon Missile Systems
        position: RF/Antenna Project Manager & RF Mechanical Design Engineer
        location: Tucson, AZ
        start_date: '2006-05'
        end_date: '2014-06'
        highlights:
          - Led design and optimization of radome assemblies and antennas for missile programs as Responsible Engineering Authority, applying statistical DOE and coupled mechanical/electrical simulation (ANSYS HFSS, Mechanical) to improve reliability and design margin.
          - Designed robust RF/electronic packaging meeting EMI, vibration, and thermal requirements, delivering detailed mechanical designs per industry standards and GD&T for mission-critical hardware.

